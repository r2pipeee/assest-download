<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        .download-btn {
            display: inline-block;
            background: #007aff;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 48px;
            border-radius: 40px;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
        }
        .download-btn:hover {
            background: #005bbf;
            transform: scale(1.02);
        }
        .download-btn:active {
            transform: scale(0.97);
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #888;
        }
        .footer a {
            color: #007aff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Download button – points to launcher.apk -->
        <a href="launcher.apk" class="download-btn" download>⬇ Download</a>

        <div class="footer">
            <a href="terms.html" target="_blank">Terms &amp; Conditions</a>
        </div>
    </div>

</body>
</html>
