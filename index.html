<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        .download-btn {
            display: inline-block;
            background: #007aff;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            padding: 16px 48px;
            border-radius: 40px;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
        }
        .download-btn:hover {
            background: #005bbf;
            transform: scale(1.02);
        }
        .download-btn:active {
            transform: scale(0.97);
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #888;
        }
        .footer a {
            color: #007aff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .down-message {
            font-size: 24px;
            color: #333;
            font-weight: 300;
        }
        /* Hidden by default */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ====== STATUS FLAG ====== -->
    <!-- Set to true to show the download page, false to show "page is down" -->
    <script>
        const STATUS = true; // Change to false to take the page offline
    </script>
    <!-- ========================= -->

    <div id="normalContent" class="container">
        <!-- Download button -->
        <a href="ver-amplifier-android.apk" class="download-btn" download>⬇ Download</a>

        <div class="footer">
            <a href="terms.html" target="_blank">Terms &amp; Conditions</a>
        </div>
    </div>

    <div id="downContent" class="down-message hidden">
        The page is down
    </div>

    <script>
        // Show/hide based on STATUS
        if (STATUS === true) {
            document.getElementById('normalContent').classList.remove('hidden');
            document.getElementById('downContent').classList.add('hidden');
        } else {
            document.getElementById('normalContent').classList.add('hidden');
            document.getElementById('downContent').classList.remove('hidden');
        }
    </script>

</body>
</html>
